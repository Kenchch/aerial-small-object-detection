version: 2

# Actions were floating on mutable tags and nothing watched the pinned
# requirements, so a CI break or an advisory arrived only when something else
# happened to fail. Monthly keeps the noise low enough to actually read.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

    # Reviewed benchmark-runtime proposals; see docs/DEPENDENCIES.md.
    # Narrow version ignores leave other upgrades visible for future review.
    ignore:
      - dependency-name: numpy
        versions: [">=2.5,<3"] # Python 3.11 is still supported by this project.
      - dependency-name: torch
        versions: ["2.14.*"]
      - dependency-name: onnxruntime-gpu
        versions: ["1.29.*"]
      - dependency-name: ultralytics
        versions: ["8.4.138"]
