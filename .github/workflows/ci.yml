name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a new advisory against a pin fails a build even in a week with
  # no push - otherwise the audit below only runs when something else changes.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a second push while the first is still going wastes a
# runner on a commit nobody is waiting for any more, and on a matrix this
# wide that is several.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # requirements.txt pins torch, ultralytics and onnxruntime-gpu, none of
      # which this suite needs or a CI runner can use. The whole point of the
      # tests is that they run without them: test_cli.py makes torch,
      # ultralytics and cv2 UNIMPORTABLE and asserts every --help still exits 0,
      # and the metric tests drive pure functions on synthetic input. Installing
      # a CUDA stack here would take minutes and weaken the guarantee.
      # numpy IS installed; torch, ultralytics, opencv and CUDA are not. That
      # is the line the bare-clone guarantee actually draws: the metric tests
      # compute on arrays, so they need numpy, while test_cli.py makes torch,
      # ultralytics and cv2 unimportable and asserts every --help still exits 0.
      # Locally numpy was always present via conda, so the first CI run was
      # what established that the distinction had never been tested.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # From requirements-dev.txt, the file the README tells a reader to
          # install, rather than a list typed out here. The hand-written list
          # carried PyYAML while requirements-dev.txt did not, so `pytest` on a
          # clean install stopped at collection and CI could not see it.
          pip install -r requirements-dev.txt pip-audit

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Test
        # No GPU, no dataset, no checkpoint - exactly the environment the
        # bare-clone guarantee is about.
        run: pytest -q

      - name: Audit dependencies
        # The pinned set is what a reader would install, so it is what gets
        # audited, even though CI does not install it itself.
        #
        # torch is pinned at 2.6.0 with known advisories, and they are ignored
        # here deliberately rather than by dropping --strict. The pin is not a
        # preference: this project's GPU driver (532.09) constrains it to the
        # cu124 build line, and every published metric and latency figure was
        # measured on it. Moving to 2.7+ would invalidate the numbers this repo
        # exists to show.
        #
        # What the ignored advisories are, since "RCE via checkpoints" is not
        # an accurate summary of them. Most are operator bugs: wrong results
        # (PairwiseDistance, bitwise_right_shift, FractionalMaxPool2d), crashes
        # and denial of service (proxy_tensor, cummin, linalg.lu), and buffer
        # or integer overflows (Conv2d, nan_to_num). Two concern loading:
        # PYSEC-2026-2286, in the weights_only unpickler, and PYSEC-2026-139,
        # which has no fixed version at all. The loading risk is handled
        # outside torch: the documented download verifies the release sha256,
        # and the evaluation scripts and the image default to
        # ULTRALYTICS_SAFE_LOAD=1, so a checkpoint is not unpickled freely.
        #
        # Listing the IDs rather than disabling the step means a NEW advisory,
        # in torch or anything else, still fails the build. An audit that is
        # allowed to fail is one nobody reads. The IDs were reviewed against
        # torch 2.6.0 and are global once listed, so a changed pin fails first
        # rather than carrying them over unreviewed.
        run: |
          grep -qx 'torch==2.6.0' requirements.txt \
            || { echo "torch pin changed: re-review the --ignore-vuln list"; exit 1; }
          pip-audit -r requirements.txt --strict \
            --ignore-vuln PYSEC-2025-191 --ignore-vuln PYSEC-2025-194 \
            --ignore-vuln PYSEC-2025-198 --ignore-vuln PYSEC-2025-199 \
            --ignore-vuln PYSEC-2025-200 --ignore-vuln PYSEC-2025-201 \
            --ignore-vuln PYSEC-2025-202 --ignore-vuln PYSEC-2025-203 \
            --ignore-vuln PYSEC-2025-204 --ignore-vuln PYSEC-2025-205 \
            --ignore-vuln PYSEC-2025-206 --ignore-vuln PYSEC-2025-207 \
            --ignore-vuln PYSEC-2025-208 --ignore-vuln PYSEC-2025-209 \
            --ignore-vuln PYSEC-2026-139  --ignore-vuln PYSEC-2026-1970 \
            --ignore-vuln PYSEC-2026-2286 --ignore-vuln CVE-2025-2148 \
            --ignore-vuln CVE-2025-2149  --ignore-vuln CVE-2025-2998 \
            --ignore-vuln CVE-2025-2999  --ignore-vuln CVE-2025-3001

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Dockerfile had never been built by anything. It has since carried a
      # sed that silently stopped matching, a base image whose torch disagreed
      # with requirements.txt, a missing libGL that would have taken down every
      # command in the image, and a `COPY . .` shipping 60 MB of weights, git
      # history and demo video. Each was found by reading rather than building,
      # which is not a method that scales.
      - name: Build the image
        run: docker build -t aerial-detection .

      # `docker run <image>` with no mounts must fail for a stated reason, not
      # an ImportError. The default command needs /weights, and saying so is the
      # difference between a usable image and a puzzle.
      #
      # Exact, because the old check - non-zero exit and any of "weights",
      # "not found" or "No such file" - also passed a libGL ImportError ("No
      # such file or directory") and a CMD that had lost --weights ("required:
      # --weights").
      - name: Default command reports what it needs
        run: |
          set +e
          out=$(docker run --rm aerial-detection 2>&1); code=$?
          set -e
          echo "$out" | tail -5
          test $code -eq 2 || { echo "expected argparse's exit 2, got $code"; exit 1; }
          echo "$out" | grep -qF -- "--weights /weights/best.pt not found" \
            || { echo "the failure did not name the missing weights"; exit 1; }
          ! echo "$out" | grep -q Traceback || { echo "it failed with a traceback"; exit 1; }

      # onnxruntime-gpu's CUDA provider links cuDNN's sub-libraries directly and
      # has no RPATH; in this base image they are only under torch's
      # nvidia/*/lib, which the Dockerfile puts on LD_LIBRARY_PATH. Without that
      # the provider fails to load and ORT falls back to the CPU. Resolving the
      # libraries needs no GPU, so it can be checked here.
      - name: The CUDA provider's libraries resolve
        run: |
          docker run --rm aerial-detection -c "
          import pathlib, subprocess, onnxruntime
          lib = pathlib.Path(onnxruntime.__file__).parent / 'capi' / 'libonnxruntime_providers_cuda.so'
          out = subprocess.run(['ldd', str(lib)], capture_output=True, text=True, check=True).stdout
          missing = [line.strip() for line in out.splitlines() if 'not found' in line]
          assert not missing, 'unresolved: ' + '; '.join(missing)
          print('  every library', lib.name, 'links against resolves')
          "

      # The declared /data volume must actually be used. It was declared and
      # never passed, so --data fell back to the bundled VisDrone.yaml, whose
      # `download:` key pulls the dataset into the container on every run and
      # fails outright offline.
      - name: Default command uses the mounted dataset
        run: |
          cmd=$(docker inspect -f '{{json .Config.Cmd}}' aerial-detection)
          echo "$cmd"
          echo "$cmd" | grep -q -- "--data" || { echo "CMD does not pass --data"; exit 1; }
          # ENTRYPOINT is already python, so the command starts at -c.
          docker run --rm aerial-detection -c             "import yaml; c=yaml.safe_load(open('docker/VisDrone.yaml'));              assert c['path'].startswith('/data'), c['path'];              assert 'download' not in c, 'the container spec must not auto-download';              print('  container dataset spec ->', c['path'])"

      # A read-only /weights must survive an export. CI never ran a successful
      # benchmark - only the no-mount failure and --help - so it could not have
      # caught the export writing into the weights mount. A stub exporter makes
      # the path testable without a GPU, a checkpoint or a dataset.
      - name: Export works with weights mounted read-only
        run: |
          mkdir -p ro-weights rw-cache && echo fake > ro-weights/best.pt
          docker run --rm             -v "$PWD/ro-weights:/weights:ro"             -v "$PWD/rw-cache:/out"             aerial-detection -c "
          import sys; sys.path.insert(0, 'src')
          from pathlib import Path
          import benchmark
          def stub(src):
              p = src.with_suffix('.onnx'); p.write_bytes(b'graph'); return p
          benchmark.export_onnx(Path('/weights/best.pt'),
                                Path('/out/onnx-cache/best_1024.onnx'), 1024, exporter=stub)
          print('  exported to /out with /weights read-only')
          "
          test -f rw-cache/onnx-cache/best_1024.onnx || { echo "no onnx in the cache"; exit 1; }
          test "$(ls ro-weights)" = "best.pt" || { echo "the weights mount was written to"; exit 1; }

      # Every script must still answer --help inside the image, with no mounts
      # and no GPU. This is the containerised half of test_cli.py. The list is
      # the directory rather than typed out, which had left make_demo_gif out.
      - name: --help works inside the image
        run: |
          for path in src/*.py; do
            docker run --rm aerial-detection "$path" --help > /dev/null \
              || { echo "$path --help failed inside the image"; exit 1; }
            echo "  $path OK"
          done

      # The image is documented as runnable without root, and nothing here had
      # ever checked that. Run it as a non-root UID against a mount that UID
      # owns, which is the arrangement the Dockerfile tells people to use.
      #
      # This is also why there is no `USER` line to test: a hardcoded UID fails
      # on any mount it does not own, and Docker creates named volumes
      # root-owned. Passing --user is the only form that survives both.
      #
      # Writing /out was never the whole story: the default command's first
      # .val() makes a directory under ./runs, and /workspace was root-owned,
      # so it died with PermissionError while this step still passed. The
      # second half creates the save directory ultralytics resolves by default,
      # as that user.
      - name: The image runs as a non-root user
        run: |
          mkdir -p nonroot-out && sudo chown 12345:12345 nonroot-out
          docker run --rm --user 12345:12345 -v "$PWD/nonroot-out:/out" \
            --entrypoint python aerial-detection -c "
          import os, pathlib, ultralytics
          from ultralytics.cfg import get_cfg, get_save_dir
          assert os.getuid() == 12345, os.getuid()
          pathlib.Path('/out/probe').write_text('written by a non-root user')
          d = get_save_dir(get_cfg(overrides={'mode': 'val', 'task': 'detect'}))
          d.mkdir(parents=True, exist_ok=True)
          print('  ultralytics', ultralytics.__version__, 'imported as', os.getuid())
          print('  default val directory is writable:', d.resolve())
          print('  YOLO_CONFIG_DIR =', os.environ['YOLO_CONFIG_DIR'])
          "
          test -f nonroot-out/probe || { echo "the non-root user could not write /out"; exit 1; }
          echo "  /out is writable by the mount's owner"

      # The image is what ships, and it keeps packages the base image brought
      # that `pip-audit -r requirements.txt` above never sees. Reported, not yet
      # enforced: the base image's conda packages have not been triaged, and
      # an audit that fails on day one for reasons nobody has reviewed gets
      # switched off. Make it strict once its first report has been read.
      - name: Audit the image (report only)
        continue-on-error: true
        run: |
          docker run --rm --entrypoint sh aerial-detection -c \
            'pip install -q pip-audit && pip-audit'
